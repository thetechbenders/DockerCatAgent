# Build dockercatagent:local from the complete Git context on this endpoint first.
name: dockercatagent
services:
  agent:
    image: dockercatagent:local
    user: "1000:1000"
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      HOME: /home/dev
      TERM: xterm-256color
    volumes:
      - workspace:/workspace
      - home:/home/dev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD", "/usr/local/bin/dockercat-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
volumes:
  workspace:
  home:
