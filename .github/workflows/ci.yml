name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh .github/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Static policy tests
        run: python3 tests/static_check.py
      - name: Signing-key trust regression
        run: bash tests/signing-key-check.sh
      - name: Wiki export regression
        run: python3 -m unittest discover -s tests -p 'test_wiki_export.py'
      - name: Export and validate current wiki source
        run: |
          wiki_preview="$(mktemp -d)"
          rmdir "$wiki_preview"
          trap 'rm -rf -- "$wiki_preview"' EXIT
          python3 scripts/export-wiki.py --ref "$(git rev-parse HEAD)" --output "$wiki_preview"
          python3 - "$wiki_preview" <<'PY'
          import json
          from pathlib import Path
          import sys
          output = Path(sys.argv[1])
          manifest = json.loads((output / "manifest.json").read_text())
          assert len(manifest["pages"]) == 11, "Expected all 11 reviewed wiki pages"
          assert all((output / name).is_file() for name in manifest["pages"])
          PY
      - name: Compose configuration
        run: |
          docker compose -f compose.yml config -q
          SSH_AUTHORIZED_KEYS_FILE="$PWD/.env.example" docker compose -f compose.yml -f compose.ssh.yml config -q
          OBSIDIAN_VAULT_PATH="$PWD/wiki" docker compose -f compose.yml -f compose.obsidian.yml config -q
          OBSIDIAN_VAULT_PATH="$PWD/wiki" docker compose -f compose.yml -f compose.obsidian-write.yml config -q
          docker compose -f compose.portainer.yml config -q
  build-smoke:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build image
        run: docker compose build --pull
      - name: Credential-free runtime regressions
        run: python3 -u tests/runtime_check.py
